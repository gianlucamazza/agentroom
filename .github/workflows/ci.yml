name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# Branch protection requires these checks with the branch up to date ("strict"),
# so the PR run tests the exact post-merge tree — re-running on the push to main
# would repeat identical work and is intentionally dropped. Cancel superseded
# runs so new commits on a PR don't stack. Use the "Run workflow" button
# (workflow_dispatch) to run CI against main manually if ever needed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only reads the repo. Jobs that need more must ask explicitly.
permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: ShellCheck scripts/
        # -S warning: fail on warnings and errors, not on info/style notes
        # (e.g. SC2015 on the intentional `[[ -n pid ]] && kill … || true` cleanups),
        # which also keeps the gate stable across shellcheck versions.
        run: shellcheck -S warning scripts/*.sh

  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22", "24", "26"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run lint

      - name: Unit + Integration tests
        run: npm run test --workspaces --if-present
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET || 'testonly_hmac_secret_minimum_32_chars' }}
          AGENTROOM_DB: ":memory:"
          RATE_LIMIT_DISABLED: "1"

      # Real end-to-end run over actual CLI + relay processes (invite → listen →
      # send → receive, persistence, store-and-forward, server restart+reconnect).
      # Run once (Node 22) — it exercises the live paths the unit tests can't.
      - name: Smoke E2E (real CLI processes)
        if: matrix.node == '22'
        run: bash scripts/smoke-e2e.sh
        env:
          HMAC_SECRET: ${{ secrets.HMAC_SECRET || 'testonly_hmac_secret_minimum_32_chars' }}

  plugin:
    name: Plugin bundle & manifests
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Validate plugin & marketplace manifests
        run: |
          node -e '
            const fs = require("fs");
            const p = JSON.parse(fs.readFileSync(".claude-plugin/plugin.json", "utf8"));
            const m = JSON.parse(fs.readFileSync(".claude-plugin/marketplace.json", "utf8"));
            if (!p.name || !p.version) throw new Error("plugin.json missing name/version");
            if (!m.name || !Array.isArray(m.plugins) || !m.plugins.length) throw new Error("marketplace.json missing plugins");
            if (p.version !== require("./package.json").version) throw new Error("plugin.json version != package.json version");
            console.log("manifests ok:", p.name, p.version);
          '

      - name: Rebuild bundle and check it is committed in sync
        run: |
          npm run bundle:cli
          git diff --exit-code -- bin/agentroom \
            || (echo "::error::bin/agentroom is stale — run 'npm run bundle:cli' and commit" && exit 1)

      - name: SKILL.md copies in sync with root
        run: |
          diff SKILL.md skills/agentroom/SKILL.md \
            || (echo "::error::skills/agentroom/SKILL.md is stale — run 'npm run sync-skill' and commit" && exit 1)
          diff SKILL.md .claude/skills/agentroom/SKILL.md \
            || (echo "::error::.claude/skills/agentroom/SKILL.md is stale — run 'npm run sync-skill' and commit" && exit 1)

      - name: Smoke — bundle runs self-contained (no node_modules in cwd)
        run: |
          tmp="$(mktemp -d)"
          cd "$tmp"
          node "$GITHUB_WORKSPACE/bin/agentroom" version

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t agentroom:ci .

      - name: Smoke Docker health
        run: |
          docker run -d --name agentroom-ci \
            -e HMAC_SECRET=testonly_hmac_secret_minimum_32_chars \
            -p 8787:8787 \
            agentroom:ci
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8787/health | jq -e '.ok == true' >/dev/null && break
            sleep 2
          done
          docker logs agentroom-ci
          docker stop agentroom-ci

  audit:
    name: npm audit
    runs-on: ubuntu-latest
    # Informational: surfaces high/critical advisories without blocking merges
    # (transient upstream advisories shouldn't gate unrelated changes).
    continue-on-error: true

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
