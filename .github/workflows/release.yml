name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build + tests (gate)
        run: npm run build && npm run test --workspaces --if-present
        env:
          HMAC_SECRET: testonly_hmac_secret_minimum_32_chars
          AGENTROOM_DB: ":memory:"
          RATE_LIMIT_DISABLED: "1"

      - name: Verify the committed bundle matches this tag
        run: |
          npm run bundle:cli
          git diff --exit-code -- bin/agentroom \
            || (echo "::error::bin/agentroom is stale for ${GITHUB_REF_NAME} — run 'npm run bundle:cli' and re-tag" && exit 1)

      - name: Release notes from CHANGELOG
        run: |
          bash scripts/changelog-extract.sh "${GITHUB_REF_NAME}" > RELEASE_NOTES.md
          echo "----- notes -----"; cat RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || echo "(no CHANGELOG section found for ${GITHUB_REF_NAME})" > RELEASE_NOTES.md

      - name: Checksums
        run: sha256sum bin/agentroom > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "${GITHUB_REF_NAME}" in
            *-rc*|*-beta*|*-alpha*) flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            "${flags[@]}" \
            bin/agentroom SHA256SUMS
