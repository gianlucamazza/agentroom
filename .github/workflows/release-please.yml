name: Release Please

# Single, conventional-commit-driven release pipeline.
#
#   push to main ──► release-please opens/updates a "Release PR" that bumps every
#                    version file (root + 4 packages + plugin.json + marketplace.json,
#                    see release-please-config.json) and regenerates the CHANGELOG.
#   merge that PR ─► release-please creates the tag + GitHub Release, then this same
#                    run attaches the self-contained bundle and (optionally) publishes
#                    to npm. The tag/asset/npm jobs are downstream JOBS in this one
#                    workflow run, so GITHUB_TOKEN drives them fine (no PAT needed there).
#
# The Release PR itself is created with RELEASE_PLEASE_TOKEN (a PAT) — see the token note
# on the action below: a GITHUB_TOKEN-created PR cannot trigger ci.yml, so it could never
# satisfy the strict required checks on main.
#
# CI (ci.yml) gates every PR on tests + an in-sync bin/agentroom + matching manifest
# versions, so there is no separate release-time gate here.

on:
  push:
    branches: [main]

# Serialize release runs so two quick pushes to main can't race the
# tag/asset/publish steps. Never cancel a release that is mid-flight.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    # release-please-action@v4 still ships on the Node20 runtime; opt its JS into
    # Node24 ahead of the June 2026 forced cutover to silence the deprecation warning.
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          # A PAT (not the default GITHUB_TOKEN): events created by GITHUB_TOKEN do not
          # trigger other workflows, so the Release PR would carry zero checks and could
          # never satisfy the branch-protection required checks. A PAT-created PR triggers
          # ci.yml normally. Falls back to GITHUB_TOKEN if the secret is unset (the PR is
          # still opened; it just won't run CI until the secret is configured).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: Attach release assets
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build the single-file bundle + checksums
        run: |
          npm run bundle:cli
          sha256sum bin/agentroom > SHA256SUMS

      - name: Attach bundle + SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" bin/agentroom SHA256SUMS --clobber

  npm:
    name: Publish to npm
    needs: release-please
    # Dormant until opt-in (set repo variable PUBLISH_NPM=true). See README "Releases".
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    # Trusted-publisher OIDC claim = repo + this workflow file + environment 'npm'.
    # If you migrated from npm-publish.yml, update the Trusted Publisher on npmjs.com
    # to reference release-please.yml (environment: npm).
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # NB: no `registry-url` on purpose — it would write an .npmrc with an empty
      # _authToken and force (failed) token auth instead of OIDC.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      # Trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest && npm --version

      - run: npm ci

      - name: Build the single-file bundle
        run: npm run bundle:cli

      - name: Assemble the publish package (inject version from the release tag)
        run: |
          v="${TAG#v}"
          cp bin/agentroom publish/agentroom
          chmod +x publish/agentroom
          ( cd publish && npm pkg set version="$v" )
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Publish (OIDC + provenance)
        run: cd publish && npm publish --access public --provenance --@gianlucamazza:registry=https://registry.npmjs.org
