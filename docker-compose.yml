services:
  agentroom:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - .env
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
