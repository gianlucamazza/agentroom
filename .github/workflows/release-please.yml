name: Release Please

# Single, conventional-commit-driven release pipeline.
#
#   push to main ──► release-please opens/updates a "Release PR" that bumps every
#                    version file (root + 4 packages + plugin.json + marketplace.json,
#                    see release-please-config.json) and regenerates the CHANGELOG.
#   merge that PR ─► release-please creates the tag + GitHub Release, then this same
#                    run attaches the self-contained bundle and (optionally) publishes
#                    to npm. Everything happens in ONE workflow run, so no PAT/GitHub
#                    App is needed to trigger downstream jobs (the GITHUB_TOKEN that
#                    creates the release cannot, by design, trigger a separate workflow).
#
# CI (ci.yml) already gates every PR on tests + an in-sync bin/agentroom + matching
# manifest versions, so there is no separate release-time gate here.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  assets:
    name: Attach release assets
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Build the single-file bundle + checksums
        run: |
          npm run bundle:cli
          sha256sum bin/agentroom > SHA256SUMS

      - name: Attach bundle + SHA256SUMS to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" bin/agentroom SHA256SUMS --clobber

  npm:
    name: Publish to npm
    needs: release-please
    # Dormant until opt-in (set repo variable PUBLISH_NPM=true). See README "Releases".
    if: ${{ needs.release-please.outputs.release_created == 'true' && vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    # Trusted-publisher OIDC claim = repo + this workflow file + environment 'npm'.
    # If you migrated from npm-publish.yml, update the Trusted Publisher on npmjs.com
    # to reference release-please.yml (environment: npm).
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      # NB: no `registry-url` on purpose — it would write an .npmrc with an empty
      # _authToken and force (failed) token auth instead of OIDC.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest && npm --version

      - run: npm ci

      - name: Build the single-file bundle
        run: npm run bundle:cli

      - name: Assemble the publish package (inject version from the release tag)
        run: |
          v="${TAG#v}"
          cp bin/agentroom publish/agentroom
          chmod +x publish/agentroom
          ( cd publish && npm pkg set version="$v" )
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}

      - name: Publish (OIDC + provenance)
        run: cd publish && npm publish --access public --provenance --@gianlucamazza:registry=https://registry.npmjs.org
