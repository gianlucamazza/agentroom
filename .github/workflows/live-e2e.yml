name: Live E2E (manual)

# On-demand validation of the headline capability: two real AI agents talking
# over the E2E-encrypted relay. This path never runs in the regular CI (scripts/
# e2e-live.sh auto-SKIPs without auth), so it lives here behind workflow_dispatch.
#
# Set ANY ONE of the secrets below; the test auto-selects a provider (Anthropic →
# OpenAI → DeepSeek). With none set the script skips (exit 0) and the job stays
# green — so this workflow is safe to keep regardless.
# Cost when it does run: ~3-4 LLM calls on the cheapest model (bounded --max-turns).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-e2e:
    name: Live agent↔agent E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - run: npm ci

      - name: Run live E2E
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: npm run e2e:live
