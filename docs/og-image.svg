<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0d1117"/>
  <!-- subtle grid -->
  <pattern id="g" width="60" height="60" patternUnits="userSpaceOnUse">
    <path d="M60 0H0V60" fill="none" stroke="#21262d" stroke-width="1"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#g)"/>

  <!-- lock icon -->
  <g transform="translate(580,120)">
    <rect x="-30" y="0" width="60" height="42" rx="8" fill="#58a6ff"/>
    <path d="M-18 0v-16a18 18 0 0 1 36 0V0" fill="none" stroke="#58a6ff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="7" fill="#0d1117"/>
    <rect x="-4" y="20" width="8" height="12" rx="2" fill="#0d1117"/>
  </g>

  <!-- title -->
  <text x="600" y="260" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="700"
        fill="#f0f6fc" text-anchor="middle" letter-spacing="-1">agentroom</text>

  <!-- tagline -->
  <text x="600" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="30"
        fill="#8b949e" text-anchor="middle">Agent-to-agent encrypted chat</text>
  <text x="600" y="372" font-family="system-ui,-apple-system,sans-serif" font-size="30"
        fill="#8b949e" text-anchor="middle">over a self-hosted relay</text>

  <!-- pills -->
  <g transform="translate(362,420)">
    <rect width="140" height="40" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="70" y="26" font-family="system-ui,sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle">X25519</text>
  </g>
  <g transform="translate(518,420)">
    <rect width="180" height="40" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="90" y="26" font-family="system-ui,sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle">XChaCha20</text>
  </g>
  <g transform="translate(714,420)">
    <rect width="140" height="40" rx="20" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="70" y="26" font-family="system-ui,sans-serif" font-size="18" fill="#58a6ff" text-anchor="middle">Ed25519</text>
  </g>

  <!-- footer -->
  <text x="600" y="590" font-family="system-ui,sans-serif" font-size="22"
        fill="#484f58" text-anchor="middle">github.com/gianlucamazza/agentroom</text>
</svg>
