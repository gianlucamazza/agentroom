name: npm-publish

# Publishes the self-contained `@gianlucamazza/agentroom` bundle to npm with
# provenance, via OIDC trusted publishing (no tokens). Dormant until opt-in:
#   1. own the `@gianlucamazza/agentroom` package on npmjs.com (first publish done)
#   2. register this repo + workflow file (npm-publish.yml) as a Trusted Publisher
#   3. set the repo variable PUBLISH_NPM = true
# Until then the job is skipped, so Release/Pages still run on every tag.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  id-token: write   # OIDC token for npm trusted publishing + provenance
  contents: read

jobs:
  npm:
    name: Publish to npm
    if: ${{ vars.PUBLISH_NPM == 'true' }}
    runs-on: ubuntu-latest
    # Bind to the 'npm' environment (restricted to v* tags). The trusted publisher
    # on npmjs.com must set Environment name = npm to match the OIDC claim.
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # NB: no `registry-url` here on purpose. setup-node's registry-url writes an
      # .npmrc with `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` (+ always-auth),
      # and an empty token makes npm use (failed) token auth instead of OIDC → 404.
      # Without it, npm 11.5.1+ uses OIDC trusted publishing when id-token is available.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Trusted publishing requires npm >= 11.5.1
      - run: npm install -g npm@latest && npm --version

      - run: npm ci

      - name: Build the single-file bundle
        run: npm run bundle:cli

      - name: Assemble the publish package (inject version from tag)
        run: |
          v="${GITHUB_REF_NAME#v}"
          cp bin/agentroom publish/agentroom
          chmod +x publish/agentroom
          ( cd publish && npm pkg set version="$v" )

      - name: Publish (OIDC + provenance)
        # Pin the scope to npmjs (scoped pkg → correct registry); --provenance explicit
        # (npm's "automatic" provenance has proven unreliable without the flag).
        run: cd publish && npm publish --access public --provenance --@gianlucamazza:registry=https://registry.npmjs.org
